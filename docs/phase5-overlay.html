<!doctype html><html lang="es"><meta charset="utf-8"><title>TiltClock: superposición visual</title>
<style>body{font:16px system-ui;background:#18202c;color:white;padding:24px}#stage{position:relative;width:596px;height:596px}img{position:absolute;width:100%;height:100%;border-radius:50%}#native{opacity:.5}label{display:block;margin:16px 0}p{max-width:70ch}</style>
<h1>Comparación web / Android</h1><p>Referencia: canvas útil 298 px; se excluye el borde web de 1 px. Android se normaliza al mismo diámetro. Los datos fijos existen exclusivamente en herramientas debug. La superposición muestra diferencias; no certifica precisión de un píxel.</p>
<label>Tema <select id="theme"><option value="light">Claro</option><option value="dark">Oscuro</option></select></label>
<label>Opacidad Android <input id="alpha" type="range" min="0" max="100" value="50"></label>
<div id="stage"><canvas id="reference" width="596" height="596" style="position:absolute;width:100%;height:100%;border-radius:50%"></canvas><img id="native" alt="Captura Android"></div>
<script>const native=document.getElementById('native'),canvas=document.getElementById('reference');function update(){const theme=document.getElementById('theme').value;const image=new Image;image.onload=()=>canvas.getContext('2d').drawImage(image,1,1,298,298,0,0,596,596);image.src='captures/reference-'+theme+'.png';native.src='captures/phase5-'+theme+'.png'}document.getElementById('theme').onchange=update;document.getElementById('alpha').oninput=e=>native.style.opacity=e.target.value/100;update();</script>
</html>
